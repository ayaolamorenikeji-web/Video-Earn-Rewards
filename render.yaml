databases:
  - name: dropearn-db
    databaseName: dropearn
    user: dropearn_user
    plan: free
    region: oregon

services:
  - type: web
    name: dropearn-api
    runtime: node
    region: oregon
    plan: free

    buildCommand: |
      pnpm install &&
      pnpm --filter @workspace/api-spec run codegen &&
      BASE_PATH=/ NODE_ENV=production pnpm --filter @workspace/watch-earn run build &&
      pnpm --filter @workspace/api-server run build

    startCommand: node artifacts/api-server/dist/index.cjs

    healthCheckPath: /api/healthz

    envVars:
      - key: PORT
        value: 10000

      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: dropearn-db
          property: connectionString
