      MONETAG REWARDED VIDEO INTEGRATION
      ====================================
      To enable real ads:
      1. Replace YOUR_MONETAG_TAG_ID below with your actual Monetag publisher tag ID.

      2. Go to Monetag dashboard > Sites > Add Site and whitelist your domain.
      3. Uncomment the script tag below once you have your tag ID.
      
      The rewarded video is triggered by calling window.Monetag.showRewardedVideo()
      with success and skip callbacks. Points are only awarded on the success callback.
      
      Example:
        window.Monetag.showRewardedVideo({
          onSuccess: () => { /* award points */ },
          onSkip: () => { /* show "skipped" message */ }
        });
